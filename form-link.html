<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Formulir — AJ HRIS</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; background: #faf8ff; color: #131b2e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .card {
      width: 100%; max-width: 420px; background: #fff; border: 1px solid #ece8f4;
      border-radius: 20px; padding: 32px 28px; text-align: center;
      box-shadow: 0 18px 45px -22px rgba(19, 27, 46, .28);
    }
    .brand {
      display: inline-flex; align-items: center; gap: 8px; margin-bottom: 24px;
      font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #8a8496;
    }
    .brand-mark {
      width: 30px; height: 30px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center;
      background: #7a1f2b; color: #fff; font-size: 12px; font-weight: 800; letter-spacing: 0;
    }
    .icon-wrap {
      width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; background: #f6f2f8; color: #7a1f2b;
    }
    .icon-wrap svg { width: 26px; height: 26px; }
    .spinner {
      width: 26px; height: 26px; border-radius: 50%; border: 3px solid #eadfe6;
      border-top-color: #7a1f2b; animation: spin .85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { margin: 0 0 8px; font-size: 18px; line-height: 1.35; color: #1f2437; }
    p { margin: 0; font-size: 13px; line-height: 1.6; color: #6b7280; }
    .button {
      display: inline-flex; align-items: center; justify-content: center; margin-top: 22px;
      padding: 11px 18px; border-radius: 11px; background: #7a1f2b; color: #fff;
      font-size: 13px; font-weight: 700; text-decoration: none;
    }
    .button.secondary { background: #fff; color: #4b5563; border: 1px solid #e5e7eb; }
    .button[hidden] { display: none; }
    .hint { margin-top: 18px; font-size: 11px; color: #9ca3af; }
  </style>
</head>
<body>
  <main class="card" role="main" aria-live="polite">
    <div class="brand"><span class="brand-mark">AJ</span> HRIS &middot; CV Andela Jaya</div>
    <div class="icon-wrap" id="state-icon"><div class="spinner" aria-hidden="true"></div></div>
    <h1 id="state-title">Membuka formulir&hellip;</h1>
    <p id="state-message">Mohon tunggu sebentar, Anda akan diarahkan otomatis.</p>
    <a id="state-action" class="button" href="/#login" hidden>Buka HRIS</a>
    <p class="hint" id="state-hint"></p>
    <noscript><p class="hint">Aktifkan JavaScript untuk membuka formulir ini.</p></noscript>
  </main>
  <script type="module" src="/js/form-link.js?v=20261114-form-link-v35"></script>
</body>
</html>
