<div class="space-y-6">
  <!-- Header Title & Quick Actions -->
  <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 bg-white p-5 md:p-6 rounded-2xl border border-slate-200/80 shadow-xs">
    <div>
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-xl bg-maroon-50 text-maroon-700 flex items-center justify-center font-bold text-lg shadow-inner">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg>
        </div>
        <div>
          <h1 class="text-xl md:text-2xl font-black text-slate-800 tracking-tight">Konseling & Coaching Karyawan</h1>
          <p class="text-xs md:text-sm text-slate-500 font-medium">Employee Case Management System — Pembinaan terstruktur, objektif, dan confidential</p>
        </div>
      </div>
    </div>
    <div class="flex items-center flex-wrap gap-2.5" id="kc-top-actions">
      <button type="button" id="kc-btn-new-case" class="px-4 py-2.5 bg-maroon-700 hover:bg-maroon-800 text-white text-xs md:text-sm font-bold rounded-xl shadow-sm transition inline-flex items-center gap-2 cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        <span>Buat Case Baru</span>
      </button>
      <button type="button" id="kc-btn-export-excel" class="px-3.5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs md:text-sm font-semibold rounded-xl transition inline-flex items-center gap-1.5 cursor-pointer">
        <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        <span>Export Excel</span>
      </button>
    </div>
  </div>

  <!-- Main Navigation Tabs -->
  <div class="flex items-center gap-2 border-b border-slate-200 overflow-x-auto pb-px scrollbar-none">
    <button data-kctab="dashboard" class="kc-tab-btn px-4 py-3 text-xs md:text-sm font-bold border-b-2 border-maroon-700 text-maroon-700 whitespace-nowrap transition flex items-center gap-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
      Dashboard
    </button>
    <button data-kctab="case_management" class="kc-tab-btn px-4 py-3 text-xs md:text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-700 whitespace-nowrap transition flex items-center gap-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      Manajemen Kasus
      <span id="kc-badge-total-cases" class="hidden px-2 py-0.5 text-[10px] font-black rounded-full bg-maroon-50 text-maroon-700">0</span>
    </button>
    <button data-kctab="action_plan" class="kc-tab-btn px-4 py-3 text-xs md:text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-700 whitespace-nowrap transition flex items-center gap-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
      Action Plan
      <span id="kc-badge-active-ap" class="hidden px-2 py-0.5 text-[10px] font-black rounded-full bg-amber-100 text-amber-800">0</span>
    </button>
    <button data-kctab="follow_up" class="kc-tab-btn px-4 py-3 text-xs md:text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-700 whitespace-nowrap transition flex items-center gap-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      Jadwal Follow-up
      <span id="kc-badge-overdue-fol" class="hidden px-2 py-0.5 text-[10px] font-black rounded-full bg-rose-100 text-rose-700">0</span>
    </button>
    <button data-kctab="reports" class="kc-tab-btn px-4 py-3 text-xs md:text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-700 whitespace-nowrap transition flex items-center gap-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      Laporan & Rekap
    </button>
  </div>

  <!-- Tab Panels Container -->
  <div id="kc-panel-dashboard" class="kc-tab-content space-y-6"></div>
  <div id="kc-panel-case_management" class="kc-tab-content space-y-6 hidden"></div>
  <div id="kc-panel-action_plan" class="kc-tab-content space-y-6 hidden"></div>
  <div id="kc-panel-follow_up" class="kc-tab-content space-y-6 hidden"></div>
  <div id="kc-panel-reports" class="kc-tab-content space-y-6 hidden"></div>
</div>
