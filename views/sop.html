<div class="space-y-6">
  <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 pb-2 border-b border-slate-200/80">
    <div>
      <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Manajemen SOP</h1>
      <p class="text-sm text-slate-500 mt-0.5">Pusat pembuatan SOP, audit kepatuhan per divisi, dokumen resmi, dan flowchart Mermaid otomatis.</p>
    </div>
    <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl shrink-0 overflow-x-auto">
      <button data-stab="database" class="sop-tab px-3.5 py-1.5 text-xs font-bold rounded-lg transition bg-white text-maroon-700 shadow-sm whitespace-nowrap">
        Database SOP
      </button>
      <button data-stab="audit" class="sop-tab px-3.5 py-1.5 text-xs font-semibold rounded-lg transition text-slate-600 hover:text-slate-900 whitespace-nowrap">
        Audit &amp; Kepatuhan
      </button>
      <button data-stab="generator" class="sop-tab px-3.5 py-1.5 text-xs font-semibold rounded-lg transition text-slate-600 hover:text-slate-900 whitespace-nowrap">
        Dokumen &amp; Flowchart
      </button>
    </div>
  </div>

  <div id="sop-panel-database"></div>

  <div id="sop-panel-audit" class="hidden space-y-5">
    <div id="sop-audit-summary"></div>
    <div id="sop-audit-crud"></div>
  </div>

  <div id="sop-panel-generator" class="hidden"></div>
</div>
