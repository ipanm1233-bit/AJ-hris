<div class="space-y-6">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-slate-800" id="pk-title">Penilaian & Kontrak</h1>
      <p class="text-sm text-slate-500 mt-1" id="pk-subtitle">Evaluasi performa berkala staf (KPI) dan pengingat masa aktif ikatan dinas.</p>
    </div>
    <div id="pk-hrd-actions" class="flex items-center gap-2">
      <button id="btn-open-grade-config" class="hidden px-3.5 py-2 bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold rounded-xl transition flex items-center gap-1.5 shrink-0 shadow-2xs">
        ⚙️ Standar Grade & Keputusan HRD
      </button>
    </div>
  </div>

  <div id="pk-tab-header" class="flex items-center gap-2 border-b border-slate-100 overflow-x-auto">
    <button data-ntab="kontrak" class="pk-tab px-4 py-2.5 text-sm font-medium border-b-2 border-maroon-700 text-maroon-700 whitespace-nowrap">Kontrak Karyawan</button>
    <button data-ntab="alur_perpanjangan" class="pk-tab px-4 py-2.5 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-700 whitespace-nowrap flex items-center gap-1.5">⚡ Alur Koordinasi Perpanjangan</button>
    <button data-ntab="kpi360" class="pk-tab px-4 py-2.5 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-700 whitespace-nowrap">Tugas Penilaian 360°</button>
    <button data-ntab="hasil" class="pk-tab px-4 py-2.5 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-700 whitespace-nowrap">Hasil Penilaian</button>
    <button data-ntab="evaluasi" class="pk-tab px-4 py-2.5 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-700 whitespace-nowrap">Evaluasi Kontrak</button>
    <button data-ntab="daily" class="pk-tab px-4 py-2.5 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-700 whitespace-nowrap flex items-center gap-1.5">📊 Penilaian Harian & Target</button>
    <button data-ntab="template" class="pk-tab px-4 py-2.5 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-700 whitespace-nowrap">Template Soal KPI</button>
  </div>

  <div id="pk-panel-kontrak"></div>
  <div id="pk-panel-alur-perpanjangan" class="hidden"></div>
  <div id="pk-panel-kpi360" class="hidden"></div>
  <div id="pk-panel-hasil" class="hidden"></div>
  <div id="pk-panel-evaluasi" class="hidden"></div>
  <div id="pk-panel-daily" class="hidden"></div>
  <div id="pk-panel-template" class="hidden"></div>

  <!-- Panel Grafik Penilaian khusus Karyawan -->
  <div id="pk-panel-employee-grafik" class="hidden"></div>
</div>
