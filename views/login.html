<div class="min-h-screen bg-slate-100/80 flex flex-col justify-between pb-6">
  <!-- TOP HEADER BANNER (MAROON SYSTEM PALETTE GRADIENT) -->
  <div class="relative bg-gradient-to-b from-maroon-950 via-maroon-800 to-maroon-700 text-white pt-8 pb-16 px-4 rounded-b-[2.5rem] shadow-xl overflow-hidden text-center">
    <!-- Subtle Pattern background overlay -->
    <div class="absolute inset-0 opacity-10 pointer-events-none" style="background-image:radial-gradient(circle at 30% 20%, white 1px, transparent 1px);background-size:20px 20px;"></div>
    
    <!-- Top Brand Logo -->
    <div class="relative z-10 max-w-md mx-auto space-y-3">
      <div class="inline-flex items-center justify-center gap-2 bg-white/10 backdrop-blur-md border border-white/20 px-4 py-1.5 rounded-full shadow-inner">
        <span class="w-6 h-6 rounded-lg bg-white text-maroon-800 font-black text-xs flex items-center justify-center shadow-xs">AJ</span>
        <span class="text-xs font-bold text-white tracking-wide">HRAPP Mobile</span>
      </div>

      <div class="pt-1">
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white leading-snug">
          Halo, Selamat Datang!
        </h1>
        <p class="text-xs sm:text-sm text-maroon-100/80 font-medium mt-1">
          Portal HRIS & Operasional CV Andela Jaya
        </p>
      </div>

      <!-- Quick Decorative Illustration Banner / Badges -->
      <div class="pt-3 flex items-center justify-center gap-2">
        <span class="px-3 py-1 bg-white/10 backdrop-blur-sm rounded-full text-[11px] font-semibold text-maroon-100 border border-white/10 flex items-center gap-1.5">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-amber-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
          Sistem Presensi & HR Safe
        </span>
        <span class="px-3 py-1 bg-white/10 backdrop-blur-sm rounded-full text-[11px] font-semibold text-maroon-100 border border-white/10 flex items-center gap-1.5">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-emerald-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          Real-time Sync
        </span>
      </div>
    </div>
  </div>

  <!-- MAIN LOGIN CARD (ELEVATED WHITE CARD) -->
  <div class="relative z-20 w-full max-w-sm sm:max-w-md mx-auto px-4 -mt-10 space-y-4">
    <div class="bg-white rounded-[2rem] shadow-xl border border-slate-100 p-6 sm:p-8 space-y-5">
      <div class="border-b border-slate-100 pb-3">
        <h2 class="text-base font-extrabold text-slate-800 tracking-tight">Masuk ke Akun Anda</h2>
        <p class="text-xs text-slate-400 mt-0.5">Gunakan NIK / Username & password internal karyawan.</p>
      </div>

      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5 flex items-center gap-1.5">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-maroon-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            Username / NIK Karyawan
          </label>
          <input id="login-username" type="text" autocomplete="username" required
            class="w-full px-4 py-3 text-sm rounded-2xl bg-slate-50/80 border border-slate-200/90 font-medium text-slate-800 focus:bg-white focus:border-maroon-500 focus:ring-2 focus:ring-maroon-100 outline-none transition" placeholder="cth. ADELITA / 202401">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5 flex items-center justify-between">
            <span class="flex items-center gap-1.5">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-maroon-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
              Password
            </span>
          </label>
          <div class="relative">
            <input id="login-password" type="password" autocomplete="current-password" required
              class="w-full px-4 py-3 text-sm rounded-2xl bg-slate-50/80 border border-slate-200/90 font-medium text-slate-800 focus:bg-white focus:border-maroon-500 focus:ring-2 focus:ring-maroon-100 outline-none transition pr-16" placeholder="Masukkan password">
            <button type="button" id="toggle-pw" class="absolute right-3.5 top-3 text-slate-400 hover:text-slate-600 text-xs font-bold bg-white px-2 py-0.5 rounded-lg border border-slate-200">Lihat</button>
          </div>
        </div>

        <div class="flex items-center justify-between pt-1">
          <label class="flex items-center gap-2 text-xs font-medium text-slate-600 cursor-pointer">
            <input type="checkbox" id="login-remember" class="w-4 h-4 rounded-md border-slate-300 text-maroon-700 focus:ring-maroon-400">
            <span>Ingat Sesi Saya</span>
          </label>
        </div>

        <!-- ACTION ROW WITH PILL LOGIN BUTTON & QUICK BIOMETRIC ICON (MATCHING REFERENCE UI) -->
        <div class="pt-2 flex items-center gap-2">
          <button id="login-submit" type="submit"
            class="flex-1 bg-maroon-700 hover:bg-maroon-800 active:bg-maroon-900 text-white font-black text-sm py-3.5 px-6 rounded-full transition shadow-lg shadow-maroon-900/20 flex items-center justify-center gap-2 group cursor-pointer">
            <span id="login-btn-text">Masuk Sekarang</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
          </button>
          <button type="button" id="btn-biometric-info" title="Login Biometrik / Quick Key" class="w-12 h-12 rounded-full bg-slate-100 hover:bg-slate-200 border border-slate-200 flex items-center justify-center text-maroon-800 shrink-0 transition shadow-xs">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"/></svg>
          </button>
        </div>

        <p id="login-error" class="hidden text-xs text-red-600 bg-red-50 border border-red-100 rounded-xl p-3 font-semibold text-center"></p>
      </form>
    </div>

    <!-- FAST MENU ROW (MATCHING REFERENCE UI DESIGN) -->
    <div class="bg-white rounded-3xl p-4 border border-slate-100 shadow-sm space-y-2.5">
      <div class="flex items-center justify-between border-b border-slate-100 pb-2 px-1">
        <span class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-maroon-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          Bantuan Quick Access
        </span>
        <span class="text-[10px] font-bold text-slate-400">Pusat Layanan</span>
      </div>
      <div class="grid grid-cols-4 gap-2 text-center">
        <button type="button" class="btn-login-quick-access p-2 rounded-2xl hover:bg-slate-50 transition group" data-info="Panduan Login: Gunakan NIK Karyawan yang terdaftar di HRD dan password yang sudah diberikan. Jika belum memiliki akun, hubungi Tim HRD.">
          <div class="w-10 h-10 rounded-2xl bg-amber-50 text-amber-700 border border-amber-100/80 mx-auto flex items-center justify-center shadow-2xs group-hover:scale-105 transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
          </div>
          <span class="text-[10px] font-bold text-slate-700 leading-tight block mt-1.5">Panduan</span>
        </button>

        <button type="button" class="btn-login-quick-access p-2 rounded-2xl hover:bg-slate-50 transition group" data-info="Lupa Password? Silakan hubungi HRD / Tim IT CV Andela Jaya untuk melalukan reset password akun Anda.">
          <div class="w-10 h-10 rounded-2xl bg-blue-50 text-blue-700 border border-blue-100/80 mx-auto flex items-center justify-center shadow-2xs group-hover:scale-105 transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
          </div>
          <span class="text-[10px] font-bold text-slate-700 leading-tight block mt-1.5">Lupa Pass</span>
        </button>

        <button type="button" class="btn-login-quick-access p-2 rounded-2xl hover:bg-slate-50 transition group" data-info="Layanan Presensi: Aplikasi HRAPP mendukung presensi berbasis GPS radius lokasi kerja, swafoto / fingerprint, serta pengajuan cuti & reimbursement online.">
          <div class="w-10 h-10 rounded-2xl bg-emerald-50 text-emerald-700 border border-emerald-100/80 mx-auto flex items-center justify-center shadow-2xs group-hover:scale-105 transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          </div>
          <span class="text-[10px] font-bold text-slate-700 leading-tight block mt-1.5">Presensi</span>
        </button>

        <button type="button" class="btn-login-quick-access p-2 rounded-2xl hover:bg-slate-50 transition group" data-info="Kontak Bantuan HRD: Apabila mengalami kendala sistem, silakan kirimkan email ke hrd@andelajaya.com atau hubungi Admin Operasional.">
          <div class="w-10 h-10 rounded-2xl bg-rose-50 text-rose-700 border border-rose-100/80 mx-auto flex items-center justify-center shadow-2xs group-hover:scale-105 transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          </div>
          <span class="text-[10px] font-bold text-slate-700 leading-tight block mt-1.5">Kontak HR</span>
        </button>
      </div>
    </div>
  </div>

  <!-- SYSTEM FOOTER -->
  <div class="text-center pt-2">
    <p class="text-slate-400 text-xs font-medium">&copy; <span id="login-year"></span> CV Andela Jaya — HRIS & Operations Portal</p>
  </div>
</div>
