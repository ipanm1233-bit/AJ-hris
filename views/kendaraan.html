<div class="space-y-6">
  <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 pb-2 border-b border-slate-200/80">
    <div>
      <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Manajemen Kendaraan</h1>
      <p class="text-sm text-slate-500 mt-0.5">Pengelolaan armada operasional, log BBM, riwayat service, serta pengingat pajak & KIR.</p>
    </div>
    <div class="flex items-center gap-2 flex-wrap">
      <!-- BUTTON SURAT KUASA & ASET (A4) -->
      <button id="btn-open-doc-generator-header" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-3.5 py-2.5 rounded-xl text-sm font-bold shadow-sm transition flex items-center gap-2 cursor-pointer border border-amber-600/30">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-950" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        <span>Surat Kuasa & Aset (A4)</span>
      </button>

      <!-- EXPORT DATA BUTTON & DROPDOWN -->
      <div class="relative inline-block text-left" id="kend-export-wrap">
        <button id="btn-export-kendaraan-menu" class="bg-white hover:bg-slate-50 text-slate-700 border border-slate-200/90 px-3.5 py-2.5 rounded-xl text-sm font-semibold shadow-2xs transition flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          <span>Export Data</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
        </button>
        <div id="kend-export-menu" class="hidden absolute right-0 mt-1.5 w-64 bg-white rounded-xl shadow-xl border border-slate-100 py-1.5 z-50 text-xs">
          <button id="btn-export-excel-kendaraan" class="w-full text-left px-3.5 py-2.5 hover:bg-emerald-50 text-slate-700 hover:text-emerald-800 flex items-center gap-2.5 font-medium transition cursor-pointer">
            <span class="w-7 h-7 rounded-lg bg-emerald-100 text-emerald-800 flex items-center justify-center font-bold text-xs shrink-0">XLS</span>
            <div>
              <div class="font-bold text-slate-800">Export Excel (.xlsx)</div>
              <div class="text-[10px] text-slate-400">Master armada & rekap biaya operasional</div>
            </div>
          </button>
          <button id="btn-export-word-kendaraan" class="w-full text-left px-3.5 py-2.5 hover:bg-blue-50 text-slate-700 hover:text-blue-800 flex items-center gap-2.5 font-medium transition cursor-pointer">
            <span class="w-7 h-7 rounded-lg bg-blue-100 text-blue-800 flex items-center justify-center font-bold text-xs shrink-0">DOC</span>
            <div>
              <div class="font-bold text-slate-800">Export Word (.doc)</div>
              <div class="text-[10px] text-slate-400">Laporan resmi kop CV Andela Jaya</div>
            </div>
          </button>
          <div class="border-t border-slate-100 my-1"></div>
          <button id="btn-export-doc-gen-menu" class="w-full text-left px-3.5 py-2.5 hover:bg-amber-50 text-slate-700 hover:text-amber-900 flex items-center gap-2.5 font-medium transition cursor-pointer">
            <span class="w-7 h-7 rounded-lg bg-amber-100 text-amber-900 flex items-center justify-center font-bold text-xs shrink-0">📄</span>
            <div>
              <div class="font-bold text-slate-800">Cetak Surat Kuasa & Aset (A4)</div>
              <div class="text-[10px] text-slate-400">Format resmi SAMSAT & Dishub (PDF / Word)</div>
            </div>
          </button>
          <div class="border-t border-slate-100 my-1"></div>
          <button id="btn-export-options-kendaraan" class="w-full text-left px-3.5 py-2 hover:bg-slate-50 text-slate-600 flex items-center gap-2 font-medium transition cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
            <span>Opsi & Filter Kolom Export...</span>
          </button>
        </div>
      </div>

      <button id="btn-add-kendaraan" class="bg-maroon-700 hover:bg-maroon-800 text-white px-4 py-2.5 rounded-xl text-sm font-semibold shadow-sm transition flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        Tambah Kendaraan
      </button>
    </div>
  </div>

  <!-- REMINDER / ALERT BANNER AUTOMATIS -->
  <div id="kend-alert-wrap"></div>

  <!-- FILTER & VIEW MODE BAR -->
  <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
    <div class="flex items-center gap-3 flex-wrap flex-1 min-w-0">
      <div class="relative flex-1 min-w-[200px]">
        <input type="text" id="kend-search" placeholder="Cari Plat No / Merk / Driver..." class="w-full pl-9 pr-3 py-2 text-sm border border-slate-200 rounded-xl outline-none focus:border-maroon-400 bg-slate-50 focus:bg-white transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-400 absolute left-3 top-2.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      </div>
      <select id="kend-status-filter" class="px-3 py-2 text-sm border border-slate-200 rounded-xl outline-none focus:border-maroon-400 bg-slate-50 font-medium text-slate-700">
        <option value="ALL">Semua Kendaraan</option>
        <option value="ALERT">Segera Perpanjang / Service</option>
        <option value="SIAP">Status: Siap Pakai / Baik</option>
        <option value="SERVICE">Status: Perlu Service / Perbaikan</option>
      </select>
    </div>
    
    <!-- TABS SWITCHER -->
    <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl shrink-0">
      <button data-ktab="cards" class="kd-tab px-3.5 py-1.5 text-xs font-bold rounded-lg transition bg-white text-maroon-700 shadow-sm">
        Card Kendaraan
      </button>
      <button data-ktab="bbm" class="kd-tab px-3.5 py-1.5 text-xs font-semibold rounded-lg transition text-slate-600 hover:text-slate-900">
        Log BBM
      </button>
      <button data-ktab="service" class="kd-tab px-3.5 py-1.5 text-xs font-semibold rounded-lg transition text-slate-600 hover:text-slate-900">
        Log Service
      </button>
      <button data-ktab="pajak" class="kd-tab px-3.5 py-1.5 text-xs font-semibold rounded-lg transition text-slate-600 hover:text-slate-900">
        Pajak & KIR
      </button>
    </div>
  </div>

  <!-- PANEL CARD KENDARAAN (UTAMA) -->
  <div id="kd-panel-cards" class="space-y-4">
    <div id="kend-cards-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <!-- Dynamic Vehicle Cards rendered here -->
    </div>
  </div>

  <!-- PANELS LOG UNTUK REKAP TABEL -->
  <div id="kd-panel-bbm" class="hidden"></div>
  <div id="kd-panel-service" class="hidden"></div>
  <div id="kd-panel-pajak" class="hidden"></div>
</div>
